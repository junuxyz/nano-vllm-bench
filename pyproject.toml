[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nano-vllm-bench"
version = "0.1.0"
description = "Minimal benchmark harness for nano-vLLM implementations"
requires-python = ">=3.10,<3.13"
dependencies = [
    "flash-attn",
    "ninja",
    "numpy",
    "packaging",
    "torch>=2.4",
    "transformers>=4.51,<5",
    "triton>=3",
    "xxhash",
]
